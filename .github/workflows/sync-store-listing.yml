name: Sync store listing

# One-off automation: captures the game running on an emulator, grabs a
# handful of screenshots, and pushes the listing text (title/descriptions)
# plus the icon, feature graphic and screenshots straight to the Play
# Developer API. No Play Console UI, no browser — everything runs on the
# GitHub-hosted runner.
#
# Needs PLAY_SERVICE_ACCOUNT_JSON (same secret publish.yml / play-status.yml
# use), and that service account needs "Manage store presence" permission in
# Play Console -> Users and permissions — a separate grant from the
# "Release apps to testing tracks" permission the publish workflow needs.

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Play listing language"
        default: "en-US"
      screenshotCount:
        description: "How many captured screenshots to upload (2-8)"
        default: "4"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/play.sh com.mikmy.fuse

      - name: Sync listing text and images to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: com.mikmy.fuse
          LANGUAGE: ${{ inputs.language }}
          SCREENSHOT_COUNT: ${{ inputs.screenshotCount }}
          TITLE: "Fuse"
          SHORT_DESCRIPTION: "Drop orbs. Two of a kind fuse. Don't overflow the well."
          FULL_DESCRIPTION: |
            Drop orbs into a well. Two of the same tier that touch fuse into the next one up - and a fusion can set off the ones underneath it, chaining into something much bigger than you dropped.

            The well keeps filling. The line at the top is always waiting. And every run ends with an obvious better move you should have made - which is exactly why you'll want to go again.

            One control: drag to aim the dropper, release to drop.

            Only the smallest five tiers are ever dealt, so every big orb you see is something you actually built through chains, not luck. Scoring rewards the chain, not just the size - a long cascade beats one lucky fusion every time.

            Fuse is pure Kotlin on a canvas with procedurally synthesised sound - no game engine, no audio assets, nothing bloating the download. Loads fast, plays in short bursts or long ones.

            Free to play, supported by occasional interstitial ads between runs - never mid-drop, and capped so they stay out of your way. No account, no login required.

            How big a chain can you build before the well overflows?
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 .github/scripts/sync_store_listing.py
