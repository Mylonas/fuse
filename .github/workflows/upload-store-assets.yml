name: Upload store assets

# One-off automation: captures the game running on an emulator, grabs a
# handful of screenshots, and pushes them plus the committed feature graphic
# straight to the Play Developer API listing images. No Play Console UI, no
# browser — everything runs on the GitHub-hosted runner.
#
# Needs PLAY_SERVICE_ACCOUNT_JSON (same secret publish.yml / play-status.yml
# use), and that service account needs "Manage store presence" permission in
# Play Console -> Users and permissions — a separate grant from the
# "Release apps to testing tracks" permission the publish workflow needs.

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Play listing language"
        default: "en-US"
      screenshotCount:
        description: "How many captured screenshots to upload (2-8)"
        default: "4"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/play.sh com.mikmy.fuse

      - name: Upload images to Play listing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: com.mikmy.fuse
          LANGUAGE: ${{ inputs.language }}
          SCREENSHOT_COUNT: ${{ inputs.screenshotCount }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 .github/scripts/upload_store_images.py
